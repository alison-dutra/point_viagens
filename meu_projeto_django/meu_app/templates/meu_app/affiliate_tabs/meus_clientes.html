{% load static %}
<div class="tab-section meus-clientes">
<style>
    .meus-clientes .container-clientes {
        background: white;
        padding: 20px;
        border-radius: 12px;
    }

    .meus-clientes .container-clientes h1 {
        color: #2c3e50;
        text-align: center;
        margin-bottom: 30px;
    }

    .meus-clientes .table-responsive {
        overflow-x: auto;
    }

    .meus-clientes .table-responsive table {
        width: 100%;
        min-width: 850px;
        table-layout: fixed;
        border-collapse: collapse;
        margin-bottom: 20px;
    }

    .meus-clientes .table-responsive th,
    .meus-clientes .table-responsive td {
        box-sizing: border-box;
        vertical-align: top;
        line-height: 1.45;
    }

    .meus-clientes .table-responsive th { white-space: nowrap; }
    .meus-clientes .table-responsive th:nth-child(1), .meus-clientes .table-responsive td:nth-child(1) { width: 24%; }
    .meus-clientes .table-responsive th:nth-child(2), .meus-clientes .table-responsive td:nth-child(2) { width: 16%; }
    .meus-clientes .table-responsive th:nth-child(3), .meus-clientes .table-responsive td:nth-child(3) { width: 17%; }
    .meus-clientes .table-responsive th:nth-child(4), .meus-clientes .table-responsive td:nth-child(4) { width: 19%; }
    .meus-clientes .table-responsive th:nth-child(5), .meus-clientes .table-responsive td:nth-child(5) { width: 24%; overflow-wrap: anywhere; }

    .cliente-cadastro-actions { display: flex; justify-content: flex-end; margin-bottom: 20px; }
    .cliente-cadastro-button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white; padding: 10px 20px; border: none; border-radius: 5px;
        font-size: 14px; font-weight: 600; cursor: pointer; height: auto; line-height: normal;
    }

    .meus-clientes .table-responsive table th {
        background-color: #0a2342;
        color: white;
        text-align: left;
        padding: 12px 15px;
        font-size: 14px;
        text-transform: uppercase;
    }

    .meus-clientes .table-responsive table td {
        padding: 12px 15px;
        border-bottom: 1px solid #eee;
        font-size: 14px;
        color: #333;
    }

    .meus-clientes .table-responsive table tr:hover {
        background-color: #f1f4ff;
    }

    .meus-clientes .badge-id {
        background-color: #e9ecef;
        padding: 4px 8px;
        border-radius: 4px;
        font-weight: bold;
        color: #495057;
    }

    .meus-clientes .cadastro-cliente-panel {
    display: none;
    background: #f8f8ff;
    border: 2px solid #667eea;
    border-radius: 8px;
    padding: 20px;
    animation: slideDown 0.3s ease;
}

.meus-clientes .cadastro-cliente-panel.show { display: block; }

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
}

.meus-clientes .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.meus-clientes .form-group { margin-bottom: 15px; }
.meus-clientes .panel-title { color: #667eea; font-size: 14px; font-weight: 700; margin-bottom: 16px; }

.meus-clientes label { display: block; margin-bottom: 8px; color: #555; font-weight: 600; font-size: 14px; }

.meus-clientes input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 5px;
    font-size: 14px;
    color: #000;
    transition: border-color 0.3s;
    box-sizing: border-box;
}

.meus-clientes input:focus { outline: none; border-color: #667eea; }

</style>

<div class="container-clientes">
    <h1>Lista de Clientes</h1>

    <div class="cliente-cadastro-actions">
    <button type="button" class="cliente-cadastro-button" onclick="document.getElementById('painelCadastroCliente').classList.toggle('show')">
        + Cadastrar Cliente
    </button>
</div>

<div id="painelCadastroCliente" class="cadastro-cliente-panel" style="margin-bottom:20px;">
    <p class="panel-title">📋 Cadastrar novo cliente</p>
    <div class="form-row">
        <div class="form-group">
            <label>Nome <span style="color:#e74c3c">*</span></label>
            <input type="text" id="mc_nome" placeholder="Nome completo">
        </div>
        <div class="form-group">
            <label>Nascimento <span style="color:#e74c3c">*</span></label>
            <input type="text" id="mc_nascimento" placeholder="DD/MM/AAAA">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>CPF <span style="color:#e74c3c">*</span></label>
            <input type="text" id="mc_cpf" placeholder="000.000.000-00" maxlength="14">
        </div>
        <div class="form-group">
            <label>Celular <span style="color:#e74c3c">*</span></label>
            <input type="text" id="mc_celular" placeholder="(00) 00000-0000">
        </div>
    </div>
    <div class="form-group">
        <label>Email <span style="color:#e74c3c">*</span></label>
        <input type="text" id="mc_email" placeholder="email@exemplo.com">
    </div>
    <button onclick="mcSalvarCliente()" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; padding:10px 20px; border:none; border-radius:5px; font-size:14px; font-weight:600; cursor:pointer; width:100%; margin-top:8px;">
        ✅ Salvar Cliente e Continuar
    </button>
</div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Nome Completo</th>
                    <th>CPF</th>
                    <th>Nascimento</th>
                    <th>Celular</th>
                    <th>E-mail</th>
                </tr>
            </thead>
            <tbody>
    {% for cliente in clientes %}
    <tr>
        <td>{{ cliente.nome }}</td>
        <td>{{ cliente.cpf }}</td>
        <td>{{ cliente.nascimento }}</td>
        <td>{{ cliente.celular }}</td>
        <td>{{ cliente.email }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="5" style="text-align:center;color:#aaa;padding:40px;">Nenhum cliente cadastrado.</td></tr>
    {% endfor %}
</tbody>
        </table>
    </div>
</div>

<script>
document.getElementById('mc_cpf').addEventListener('input', function() {
    let v = this.value.replace(/\D/g, '').slice(0, 11);
    if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
    else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
    else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
    this.value = v;
});

function mcSalvarCliente() {
    const nome      = document.getElementById('mc_nome').value.trim();
    const nascimento= document.getElementById('mc_nascimento').value.trim();
    const cpf       = document.getElementById('mc_cpf').value.trim();
    const celular   = document.getElementById('mc_celular').value.trim();
    const email     = document.getElementById('mc_email').value.trim();

    if (!nome || !nascimento || !cpf || !celular || !email) {
        alert('Preencha todos os campos.');
        return;
    }

    fetch("{% url 'salvar_cliente' %}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, nascimento, cpf, celular, email })
    })
    .then(res => res.json())
    .then(res => {
        if (res.success) {
            document.getElementById('painelCadastroCliente').classList.remove('show');
            // Adiciona o cliente na tabela sem recarregar
            const tbody = document.querySelector('tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${nome}</td>
                <td>${cpf}</td>
                <td>${nascimento}</td>
                <td>${celular}</td>
                <td>${email}</td>
            `;
            tbody.appendChild(tr);
            // Limpa os campos
            ['mc_nome','mc_nascimento','mc_cpf','mc_celular','mc_email'].forEach(id => document.getElementById(id).value = '');
            alert('✅ Cliente cadastrado com sucesso!');
            setTimeout(() => window.location.reload(), 500);
        } else {
            alert('Erro: ' + res.message);
        }
    });
}
</script>

</div>
